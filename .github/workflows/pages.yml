# Publishes the site to GitHub Pages together with street tiles for the cities in
# tools/cities.json. The tiles live in the Actions cache (rebuilt monthly) and in the
# Pages artifact; they are never committed to the repo.
# Needs Settings > Pages > Source set to "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 2 * *'   # monthly, picks up a new cache key and fresh map data

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache key
        id: key
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: streets
          key: streets-${{ steps.key.outputs.month }}-${{ hashFiles('tools/cities.json', 'tools/build_streets.py') }}
      - name: Build street tiles
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          echo "download start $(date -u +%T)"
          curl -fsSL --retry 3 --max-time 1200 -w 'downloaded %{size_download} bytes in %{time_total} s\n' \
            -o "$RUNNER_TEMP/china.osm.pbf" https://download.geofabrik.de/asia/china-latest.osm.pbf
          free -m; df -h "$RUNNER_TEMP" | tail -1
          python3 tools/build_streets.py "$RUNNER_TEMP/china.osm.pbf" tools/cities.json streets
          rm -f "$RUNNER_TEMP/china.osm.pbf"
      - name: Assemble site
        run: |
          mkdir _site && cp index.html _site/
          if [ -d streets ]; then cp -r streets _site/streets; fi
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
